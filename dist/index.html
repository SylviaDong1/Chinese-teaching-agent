<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="南京大学初级汉语课堂 AI 助教：支持快问快答、全班投票和四季大冒险综合复习。" />
    <meta name="theme-color" content="#172d27" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23172d27'/%3E%3Cpath d='M16 18c16 3 26 13 30 30-16-3-26-13-30-30Z' fill='%23f3a83b'/%3E%3Cpath d='M18 46c9-7 16-14 24-24' stroke='%23fff7e9' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>AI 中文课堂助教｜四季与天气</title>
    <link rel="stylesheet" href="styles.css?v=1.3.3" />
    <script src="app.js?v=1.3.3" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-leaf" aria-hidden="true">🍂</span>
          <div>
            <p class="eyebrow">第9课 · 10月20日 · 南京大学</p>
            <h1>AI 中文课堂助教 · 四季与天气</h1>
          </div>
        </div>
        <div class="role-strip" aria-label="课堂角色">
          <span><b aria-hidden="true">👩‍🏫</b> 老师</span>
          <span><b aria-hidden="true">👨‍🎓</b> 学生玩家</span>
          <span class="agent-role"><b aria-hidden="true">🤖</b> Agent助教</span>
        </div>
      </header>

      <section class="game-hud" aria-label="游戏进度" hidden>
        <div class="turn-summary">
          <span class="hud-label">当前队伍</span>
          <strong id="current-team-label">🌸 春队</strong>
          <small id="turn-label">第 1 轮</small>
        </div>
        <div class="mission-progress">
          <div class="mission-meta"><span>全班任务进度</span><strong id="mission-count">0 / 8</strong></div>
          <div class="progress-track" role="progressbar" aria-label="全班核心任务进度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="mission-progress">
            <span class="progress-fill" id="progress-fill"></span>
          </div>
          <small id="progress-note">完成 10 次核心互动，解锁最终挑战</small>
        </div>
        <div class="hud-actions">
          <button class="button button-final" id="final-challenge-button" type="button" hidden>⚡ 最终挑战</button>
          <button class="button button-quiet button-compact" id="restart-game" type="button">重新开始</button>
          <button class="button button-quiet button-compact" id="back-to-console" type="button">返回控制台</button>
        </div>
      </section>

      <main class="game-layout">
        <section id="game-stage" class="game-stage" aria-live="polite"></section>
        <aside class="side-rail">
          <section class="agent-panel" id="agent-panel" data-state="thinking" aria-label="Agent助教">
            <div class="agent-heading">
              <div class="agent-portrait" aria-hidden="true"><span class="agent-face">🤖</span><span class="agent-spark" id="agent-state-icon">💭</span></div>
              <div><p class="agent-name">Agent助教</p><p id="agent-status" class="agent-status">主持游戏</p></div>
            </div>
            <p id="agent-message" class="agent-message">四支队伍准备好了吗？春队先来！</p>
            <button class="icon-button speaker-button" id="agent-speaker" type="button" aria-label="朗读 Agent 的话" title="朗读">🔊</button>
          </section>
          <section class="legend-panel" id="legend-panel" aria-label="地图格子说明" hidden>
            <p class="panel-label">下一格会玩什么？</p>
            <div class="legend-grid"><span>👀 看图</span><span>🎭 动作</span><span>💬 对话</span><span>🃏 配对</span><span>🤖 找问题</span><span>💣 句子诊断</span><span>⚡ 变了</span><span>⏱️ 快答</span><span>💬 表达</span><span>🎁 幸运</span></div>
          </section>
        </aside>
      </main>
    </div>
    <div class="sr-only" id="live-region" aria-live="assertive"></div>
  </body>
</html>
